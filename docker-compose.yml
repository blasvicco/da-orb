services:
  backend:
    build:
      context: .
      dockerfile: ./hub/python/Dockerfile.local
    command: 'tail -f /dev/null'
    container_name: da-orb-backend
    depends_on:
      - redis
    env_file:
      - ./app/.env.common.dev
      - ./app/backend/.env.dev
    networks:
      da_orb_net:
        aliases:
          - blas.local
    ports:
      - '80:80'
      - '8000:8000'
    volumes:
      - ./app/backend:/home/app
      - ./workflow:/home/workflow

  frontend:
    build:
      context: .
      dockerfile: ./hub/node/Dockerfile.local
    command: 'tail -f /dev/null'
    container_name: da-orb-frontend
    env_file:
      - ./app/.env.common.dev
      - ./app/frontend/.env.dev
    ports:
      - '5173:5173'
    volumes:
      - ./app/frontend:/home/app

  github-mcp:
    build:
      context: .
      dockerfile: ./hub/github-mcp/Dockerfile
    command: [ "http", "--port", "3000" ]
    container_name: da-orb-github-mcp
    env_file:
      - ./app/backend/.env.dev
    ports:
      - "3000:3000"
    networks:
      da_orb_net:
        aliases:
          - mcp.blas.local

  seaweedfs:
    container_name: da-orb-seaweedfs
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.config=/etc/seaweedfs/s3_config.json
    env_file:
      - ./app/backend/.env.dev
    healthcheck:
      # No -f: any completed HTTP response (even the 403 an unauthenticated
      # probe gets back from the auth-enabled gateway) means the S3 API is up.
      test: [ "CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8333/" ]
      interval: 3s
      timeout: 3s
      retries: 30
    image: chrislusf/seaweedfs:latest
    networks:
      da_orb_net:
        aliases:
          - seaweedfs.blas.local
    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"
    volumes:
      - da_seaweedfs_data:/data
      - ./hub/seaweedfs/s3_config.json:/etc/seaweedfs/s3_config.json:ro

  seaweedfs-init:
    container_name: da-orb-seaweedfs-init
    # weed shell hangs indefinitely instead of failing fast against a master
    # that isn't listening yet, so unlike the old mc-based init this can't
    # retry-until-ready itself — it relies on seaweedfs's healthcheck above
    # (via depends_on/service_healthy) to only start once the server is up.
    # s3.bucket.create is idempotent, so rerunning this on every `up` is safe.
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "
        echo s3.bucket.create -name=$$STORAGE_BUCKET_NAME | weed shell -master=seaweedfs.blas.local:9333
      "
    depends_on:
      seaweedfs:
        condition: service_healthy
    env_file:
      - ./app/backend/.env.dev
    image: chrislusf/seaweedfs:latest
    networks:
      - da_orb_net

  n8n-main:
    build:
      context: .
      dockerfile: ./hub/n8n/Dockerfile
    command: []
    container_name: da-orb-n8n-main
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./app/backend/.env.dev
    volumes:
      - da_n8n_main_data:/home/node/.n8n
    ports:
      - "5678:5678"
    networks:
      da_orb_net:
        aliases:
          - n8n.blas.local

  n8n-webhook:
    build:
      context: .
      dockerfile: ./hub/n8n/Dockerfile
    command: [ "webhook" ]
    container_name: da-orb-n8n-webhook
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./app/backend/.env.dev
    ports:
      - "5679:5679"
    networks:
      da_orb_net:
        aliases:
          - n8n.blas.local

  n8n-worker:
    build:
      context: .
      dockerfile: ./hub/n8n/Dockerfile
    command: [ "worker" ]
    container_name: da-orb-n8n-worker
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./app/backend/.env.dev
    networks:
      - da_orb_net

  postgres:
    build:
      context: .
      dockerfile: ./hub/postgres/Dockerfile
    container_name: postgres
    env_file:
      - ./app/backend/.env.dev
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 5s
      timeout: 10s
      retries: 120
    networks:
      da_orb_net:
        aliases:
          - db.blas.local
    ports:
      - "5432:5432"
    volumes:
      - ./hub/postgres/dumps:/home/dumps
      - da_orb_db:/var/lib/postgresql/data

  redis:
    build:
      context: .
      dockerfile: ./hub/redis/Dockerfile
    command: redis-server --save "" --appendonly no
    container_name: da-orb-redis
    networks:
      da_orb_net:
        aliases:
          - redis.blas.local
    ports:
      - "6379:6379"
    restart: unless-stopped

networks:
  da_orb_net:
    driver: bridge

volumes:
  da_orb_db:
  da_n8n_main_data:
  da_seaweedfs_data:

